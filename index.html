        <h1>CPH IDE —— 浏览器里的在线 C++ 编译与评测环境</h1>
        <p>
          CPH IDE 是一个在线 IDE：左边是 Monaco 编辑器，右边是测试样例面板。它内置「本地 WASM
          沙箱」，可以直接在浏览器里编译、运行并判定 C++ 代码，代码不出本机，断网也能用。
        </p>

        <h2>能做什么</h2>
        <ul>
          <li>在浏览器里编译运行 C++：编译与执行都在本机完成，代码不会被上传</li>
          <li>多测试样例批量运行与判定，支持时限（TLE）检测</li>
          <li>Monaco 编辑器，多语言草稿与编辑器偏好都存在浏览器本地</li>
          <li>可在本地 WASM 沙箱与 Piston / Judge0 远端评测服务之间切换</li>
          <li>可安装为独立窗口应用，装好之后断网也能编译运行</li>
        </ul>

        <h2>常见问题</h2>
        <h3>代码会上传到服务器吗？</h3>
        <p>
          用本地 WASM 沙箱时不会：编译与运行都在你自己的浏览器里完成。切到 Piston 或 Judge0
          这类远端引擎时，代码会发送到你填写的评测服务地址。
        </p>

        <h3>需要联网吗？</h3>
        <p>
          第一次用本地沙箱要先下载约 50MB 的 C++ 工具链（clang + libc++），只下一次，之后常驻浏览器缓存；
          下载过之后即可离线使用。清除了浏览器数据就要重新下载。
        </p>

        <h3>支持 Python 吗？</h3>
        <p>本地 WASM 沙箱目前只支持 C++。跑 Python 需要切换到 Piston 或 Judge0 远端评测服务。</p>

        <h3>为什么第一次运行明显更慢？</h3>
        <p>
          首次运行要先下载工具链，之后每一份新代码的第一个用例都要付一次编译开销，同一份代码连续跑多个用例只编译一次。
          卡片上的耗时只计「程序运行」那一段，不含编译与排队。
        </p>
