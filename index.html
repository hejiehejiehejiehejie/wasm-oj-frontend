          <h2>unnamed — an online C++ / Python compile-and-judge environment in your browser</h2>
          <p>
            unnamed is an online IDE: the Explorer and the test cases on the left, the Monaco editor on the right.
            It ships a local WASM sandbox that compiles, runs and judges C++ and Python code right in your browser —
            your code never leaves the machine, and it keeps working offline.
          </p>

          <h3>What it does</h3>
          <ul>
            <li>Compile and run C++ in the browser, or run Python 3 directly — both happen locally and your code is never uploaded</li>
            <li>Run and judge several test cases in one go, with time limit (TLE) detection and per-case timing</li>
            <li>Grab a problem from an online judge with the browser extension; the statement and samples land in your workspace, no copy-pasting</li>
            <li>A Monaco editor, with multi-language drafts and editor preferences stored locally in your browser</li>
            <li>A new file starts from a template by language (C++ / Python / notes); templates are editable, can be switched off, and travel with cloud sync</li>
            <li>Notes are plain Markdown — LaTeX formulas, tables and images, with a live split preview and a full-screen mode</li>

            <li>Installable as a standalone window app that compiles and runs offline once installed</li>
            <li>Native builds for macOS / Windows / Android are in development (compiling and running locally on your machine); the desktop builds can also open a folder on your computer as the workspace, reading and writing real files on disk — download details will appear in the guide once they ship</li>
          </ul>

          <h3>Common questions</h3>
          <h4>Does my code get uploaded to a server?</h4>
          <p>
            Not with the local WASM sandbox: compiling and running both happen in your own browser. Switch to a remote
            engine such as Piston or Judge0 and your code is sent to the judge service URL you entered.
          </p>

          <h4>Do I need to be online?</h4>
          <p>
            The first local run has to download the runtime: the C++ toolchain (clang + libc++) is about 50MB and the
            Python runtime about 24MB. Each is downloaded once and then stays in the browser cache, so offline use works
            from then on. Clearing your browser data means downloading again.
          </p>

          <h4>Which languages are supported?</h4>
          <p>
            The local WASM sandbox supports C++ and Python 3 (Python runs straight in the CPython interpreter and is not
            compiled). For other languages, switch to a remote Piston or Judge0 judge service.
          </p>

          <h4>Why is the first run so much slower?</h4>
          <p>
            The first run has to download the runtime; after that, the first case of every new piece of code pays the
            compilation cost once, and running several cases against the same code compiles it only once. The timing on a
            card covers the program run only, excluding compilation and queueing.
          </p>

          <h4>How much slower is the browser than native?</h4>
          <p>
            There is no single scaling factor. Measured on the same machine, pure computation is about 1.8× slower and
            sorting 2 million numbers about 6.7× slower — the ratio follows memory density and cannot be extrapolated.
          </p>
